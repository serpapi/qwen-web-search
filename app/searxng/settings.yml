# Minimal SearXNG config for the benchmark: JSON output, and the same engines Qwen can pick with SerpApi.
use_default_settings: true
server:
  secret_key: "change-me"
  limiter: false
  port: 8080
search:
  formats: [html, json]
engines:  # disabled by default in SearXNG
  - name: google
    disabled: false
  - name: baidu
    disabled: false
  - name: naver
    disabled: false
