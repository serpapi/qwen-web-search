# Small model with search vs big model without: 100 old, stable facts, asked with no search and with serpapi on every model.
# Every answer has been true since before 2020, so a model could know it from training; the questions run from common
# knowledge (easy) to specialist long-tail facts (hard), to show where each model's memory runs out and whether search
# closes the gap. Verified on recorded_on against `source` and a second source; disputed facts were left out.
# accept: case-insensitive substrings (whitespace ignored) that count as correct. Review every answer by hand;
# `review` says what makes an answer wrong when a false match is possible.

